# Runs on every pull request to main: the same checks Workers Builds runs,
# plus a typecheck, reported back to GitHub as a status check. Workers Builds
# still does the deploying, after the PR is merged.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # worker-configuration.d.ts is committed. Fail if someone changed
      # wrangler.jsonc without running `npm run cf-typegen`.
      - name: Generated types are up to date
        run: npm run types:check

      - name: Typecheck
        run: npm run typecheck

      # Runs inside workerd with local simulations. No Cloudflare account or secrets needed.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
